<rect width="1600" height="1040" fill="white"/>
<text x="800.0" y="40" font-size="26" font-weight="700" text-anchor="middle"
 fill="#1f2937">Heart Disease Risk — End-to-End MLOps Architecture</text>
<rect x="20" y="70" width="1560" height="190" rx="14" fill="#dbeafe" opacity="0.45"/><text x="38" y="100" font-size="19" font-weight="700" fill="#1f2937">1 · Data and ML pipeline  (python -m src....)</text><rect x="55" y="120" width="184" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="147.0" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">UCI dataset</text><text x="147.0" y="169" font-size="13" text-anchor="middle" fill="#6b7280">Cleveland heart disease</text><text x="147.0" y="187" font-size="13" text-anchor="middle" fill="#6b7280">303 patients, 13 features</text><rect x="269" y="120" width="184" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="361.0" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">download + preprocess</text><text x="361.0" y="169" font-size="13" text-anchor="middle" fill="#6b7280">data/raw → cleaned CSV</text><text x="361.0" y="187" font-size="13" text-anchor="middle" fill="#6b7280">? → NaN, binary target</text><rect x="483" y="120" width="184" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="575.0" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">EDA</text><text x="575.0" y="169" font-size="13" text-anchor="middle" fill="#6b7280">5 figures + summary</text><text x="575.0" y="187" font-size="13" text-anchor="middle" fill="#6b7280">reports/figures/</text><rect x="697" y="120" width="184" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="789.0" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Feature pipeline</text><text x="789.0" y="169" font-size="13" text-anchor="middle" fill="#6b7280">impute + scale numeric</text><text x="789.0" y="187" font-size="13" text-anchor="middle" fill="#6b7280">impute + one-hot categorical</text><rect x="911" y="120" width="184" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1003.0" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Train + tune</text><text x="1003.0" y="169" font-size="13" text-anchor="middle" fill="#6b7280">LogReg · RandomForest · GB</text><text x="1003.0" y="187" font-size="13" text-anchor="middle" fill="#6b7280">GridSearchCV, 5-fold CV</text><rect x="1125" y="120" width="184" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1217.0" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">MLflow tracking</text><text x="1217.0" y="169" font-size="13" text-anchor="middle" fill="#6b7280">params, metrics, plots</text><text x="1217.0" y="187" font-size="13" text-anchor="middle" fill="#6b7280">model per run (SQLite)</text><rect x="1339" y="120" width="184" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1431.0" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Package</text><text x="1431.0" y="169" font-size="13" text-anchor="middle" fill="#6b7280">models/model.joblib</text><text x="1431.0" y="187" font-size="13" text-anchor="middle" fill="#6b7280">+ mlflow_model, metadata</text><line x1="239" y1="170" x2="269" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="453" y1="170" x2="483" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="667" y1="170" x2="697" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="881" y1="170" x2="911" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="1095" y1="170" x2="1125" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="1309" y1="170" x2="1339" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="20" y="280" width="1560" height="210" rx="14" fill="#ede9fe" opacity="0.45"/><text x="38" y="310" font-size="19" font-weight="700" fill="#1f2937">2 · CI/CD  (GitHub Actions, on every push to main)</text><rect x="45" y="335" width="190" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="140.0" y="362" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Developer</text><text x="140.0" y="384" font-size="13" text-anchor="middle" fill="#6b7280">git push to main</text><text x="140.0" y="402" font-size="13" text-anchor="middle" fill="#6b7280">(or pull request)</text><rect x="290" y="335" width="190" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="385.0" y="362" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">GitHub repo</text><text x="385.0" y="384" font-size="13" text-anchor="middle" fill="#6b7280">Phenomenal-19/MlOPS</text><text x="385.0" y="402" font-size="13" text-anchor="middle" fill="#6b7280">ci.yml workflow</text><rect x="535" y="335" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="645.0" y="362" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Lint + unit tests</text><text x="645.0" y="384" font-size="13" text-anchor="middle" fill="#6b7280">ruff check · pytest</text><text x="645.0" y="402" font-size="13" text-anchor="middle" fill="#6b7280">87 tests · 84% coverage</text><rect x="791" y="335" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="901.0" y="362" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Docker</text><text x="901.0" y="384" font-size="13" text-anchor="middle" fill="#6b7280">build image, run container,</text><text x="901.0" y="402" font-size="13" text-anchor="middle" fill="#6b7280">smoke test the API</text><rect x="1047" y="335" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1157.0" y="362" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Kubernetes</text><text x="1157.0" y="384" font-size="13" text-anchor="middle" fill="#6b7280">kind cluster, deploy,</text><text x="1157.0" y="402" font-size="13" text-anchor="middle" fill="#6b7280">verify + monitoring</text><rect x="1303" y="335" width="220" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1413.0" y="362" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Train + package</text><text x="1413.0" y="384" font-size="13" text-anchor="middle" fill="#6b7280">train, quality gate,</text><text x="1413.0" y="402" font-size="13" text-anchor="middle" fill="#6b7280">sample prediction</text><line x1="235" y1="385" x2="290" y2="385" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="480" y1="385" x2="535" y2="385" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="755" y1="385" x2="791" y2="385" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="1011" y1="385" x2="1047" y2="385" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M 645 335 C 645 300, 1413 300, 1413 335" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="1029.0" y="296" font-size="12" text-anchor="middle" fill="#6b7280" font-style="italic">needs lint + tests</text><text x="1555" y="470" font-size="13" text-anchor="end" fill="#6b7280">uploads artifacts: model, reports, MLflow store, test, Docker and deploy logs</text><rect x="20" y="510" width="1000" height="270" rx="14" fill="#d1fae5" opacity="0.45"/><text x="38" y="540" font-size="19" font-weight="700" fill="#1f2937">3 · Serving on Kubernetes (kind) · namespace heart-mlops</text><rect x="40" y="590" width="170" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="125.0" y="617" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Client</text><text x="125.0" y="639" font-size="13" text-anchor="middle" fill="#6b7280">curl / browser</text><text x="125.0" y="657" font-size="13" text-anchor="middle" fill="#6b7280">localhost:8080</text><rect x="245" y="590" width="170" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="330.0" y="617" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Ingress (nginx)</text><text x="330.0" y="639" font-size="13" text-anchor="middle" fill="#6b7280">host-less rule</text><text x="330.0" y="657" font-size="13" text-anchor="middle" fill="#6b7280">path / → Service</text><rect x="450" y="590" width="170" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="535.0" y="617" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Service</text><text x="535.0" y="639" font-size="13" text-anchor="middle" fill="#6b7280">heart-api · ClusterIP</text><text x="535.0" y="657" font-size="13" text-anchor="middle" fill="#6b7280">port 80 → 8000</text><rect x="680" y="555" width="310" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="835.0" y="582" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Pod 1 · FastAPI</text><text x="835.0" y="604" font-size="13" text-anchor="middle" fill="#6b7280">/predict  /health  /metrics</text><text x="835.0" y="622" font-size="13" text-anchor="middle" fill="#6b7280">model.joblib, JSON logs</text><rect x="680" y="670" width="310" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="835.0" y="697" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Pod 2 · FastAPI</text><text x="835.0" y="719" font-size="13" text-anchor="middle" fill="#6b7280">Deployment: 2 replicas</text><text x="835.0" y="737" font-size="13" text-anchor="middle" fill="#6b7280">rolling update, probes, non-root</text><line x1="210" y1="640" x2="245" y2="640" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="415" y1="640" x2="450" y2="640" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="620" y1="625" x2="680" y2="605" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="620" y1="655" x2="680" y2="720" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="1040" y="510" width="540" height="270" rx="14" fill="#ffedd5" opacity="0.45"/><text x="1058" y="540" font-size="19" font-weight="700" fill="#1f2937">4 · Monitoring · namespace monitoring</text><rect x="1065" y="555" width="220" height="100" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="1175.0" y="582" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Prometheus</text><text x="1175.0" y="604" font-size="13" text-anchor="middle" fill="#6b7280">scrapes each pod's</text><text x="1175.0" y="622" font-size="13" text-anchor="middle" fill="#6b7280">/metrics every 15 s</text><rect x="1320" y="555" width="235" height="100" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="1437.5" y="582" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Grafana</text><text x="1437.5" y="604" font-size="13" text-anchor="middle" fill="#6b7280">11-panel dashboard</text><text x="1437.5" y="622" font-size="13" text-anchor="middle" fill="#6b7280">grafana.localhost:8080</text><rect x="1065" y="670" width="490" height="85" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="1310.0" y="697" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Metrics and logs</text><text x="1310.0" y="719" font-size="13" text-anchor="middle" fill="#6b7280">requests · latency p50/95/99 · predictions by class</text><text x="1310.0" y="737" font-size="13" text-anchor="middle" fill="#6b7280">confidence · per-pod load · CPU/memory · JSON request logs</text><line x1="1285" y1="605" x2="1320" y2="605" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="990" y1="605" x2="1065" y2="605" stroke="#475569" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="1027" y="594" font-size="12" text-anchor="middle" fill="#6b7280" font-style="italic">scrape</text><rect x="20" y="800" width="1560" height="190" rx="14" fill="#f1f5f9" opacity="0.45"/><text x="38" y="830" font-size="19" font-weight="700" fill="#1f2937">Container image and delivery</text><rect x="45" y="850" width="270" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="180.0" y="877" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Dockerfile</text><text x="180.0" y="899" font-size="13" text-anchor="middle" fill="#6b7280">python:3.12-slim · ~470 MB</text><text x="180.0" y="917" font-size="13" text-anchor="middle" fill="#6b7280">uvicorn, non-root uid 10001</text><rect x="360" y="850" width="270" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="495.0" y="877" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">docker_smoke_test.sh</text><text x="495.0" y="899" font-size="13" text-anchor="middle" fill="#6b7280">build · run · /health · /predict</text><text x="495.0" y="917" font-size="13" text-anchor="middle" fill="#6b7280">422 check · uid check</text><rect x="675" y="850" width="270" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="810.0" y="877" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">k8s_deploy.sh</text><text x="810.0" y="899" font-size="13" text-anchor="middle" fill="#6b7280">kind cluster + ingress-nginx</text><text x="810.0" y="917" font-size="13" text-anchor="middle" fill="#6b7280">load image, apply manifests</text><rect x="990" y="850" width="270" height="100" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="1125.0" y="877" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">k8s_monitoring.sh</text><text x="1125.0" y="899" font-size="13" text-anchor="middle" fill="#6b7280">Prometheus + Grafana</text><text x="1125.0" y="917" font-size="13" text-anchor="middle" fill="#6b7280">generate traffic, verify</text><rect x="1305" y="850" width="250" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1430.0" y="877" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">Teardown</text><text x="1430.0" y="899" font-size="13" text-anchor="middle" fill="#6b7280">k8s_teardown.sh</text><text x="1430.0" y="917" font-size="13" text-anchor="middle" fill="#6b7280">removes the cluster</text><line x1="315" y1="900" x2="360" y2="900" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="630" y1="900" x2="675" y2="900" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="945" y1="900" x2="990" y2="900" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><line x1="1260" y1="900" x2="1305" y2="900" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
