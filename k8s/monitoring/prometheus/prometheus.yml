global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Every pod behind the heart-api Service is scraped individually, so dashboards
  # can show per-pod traffic (and therefore load balancing).
  - job_name: heart-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [heart-mlops]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: heart-api
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
